[project]
name = "marshal-sdk"
version = "0.2.0"
description = "The Claude Agent SDK on a Marshal host: swap `claude_agent_sdk` for `marshal_sdk`."
requires-python = ">=3.10"
# Node 24 for the marshal-sdk npm package this package carries (marshal_sdk/_bundle); the Brain needs Node 24's FTS5.
dependencies = ["claude-agent-sdk>=0.2.178", "nodejs-wheel-binaries>=24.10,<25"]

[build-system]
requires = ["hatchling", "nodejs-wheel-binaries>=24.10,<25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marshal_sdk"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
