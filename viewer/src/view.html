<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SDK sessions</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
    font-size: 13px; line-height: 1.45;
    background: var(--background, Canvas); color: var(--foreground, CanvasText);
  }
  button, textarea { font: inherit; color: inherit; }
  .app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border, #8884); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  header .back { display: none; }
  input[type=search] {
    flex: 1; min-width: 0; padding: 7px 10px; border-radius: var(--radius, 8px);
    border: 1px solid var(--input, var(--border, #8886)); background: var(--card, transparent); color: inherit; font: inherit;
  }
  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(230px, 1fr) minmax(260px, 1.2fr) minmax(340px, 2.3fr); }
  .pane { min-height: 0; overflow: auto; border-right: 1px solid var(--border, #8884); display: flex; flex-direction: column; }
  .pane:last-child { border-right: 0; }
  .pane > .scroll { flex: 1; min-height: 0; overflow: auto; }
  .pane h2 {
    position: sticky; top: 0; z-index: 1; margin: 0; padding: 8px 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground, GrayText);
    background: var(--background, Canvas); border-bottom: 1px solid var(--border, #8884);
  }
  .item { display: block; width: 100%; text-align: left; padding: 9px 12px; border: 0; background: none; cursor: pointer; border-bottom: 1px solid var(--border, #8882); }
  .item:hover { background: var(--hover, var(--accent, #8881)); }
  .item[aria-current=true] { background: var(--accent, #8882); }
  .item .title { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .meta { color: var(--muted-foreground, GrayText); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border, #8886); color: var(--muted-foreground, GrayText); }
  .state { font-size: 11px; padding: 1px 6px; border-radius: 999px; font-weight: 600; }
  .state.idle, .state.online, .state.live { background: var(--success-bg, #2a62); color: var(--success-fg, var(--success, green)); }
  .state.running, .state.store { background: var(--warning-bg, #c802); color: var(--warning-fg, var(--warning, darkorange)); }
  .state.failed, .state.offline { background: var(--destructive-bg, #d002); color: var(--destructive, red); }
  .state.folder, .state.local { background: var(--muted, #8882); color: var(--muted-foreground, GrayText); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted-foreground, GrayText); }
  .dot.online { background: var(--success, green); }
  .dot.offline { background: var(--destructive, red); }
  .dot.pulse { background: var(--warning, darkorange); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }
  .child { padding-left: 26px; }
  .empty { padding: 14px 12px; color: var(--muted-foreground, GrayText); }
  .detail { padding: 10px 12px; border-bottom: 1px solid var(--border, #8884); }
  .detail .title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .live { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted-foreground, GrayText); overflow-wrap: anywhere; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin-top: 6px; font-size: 12px; }
  .kv dt { color: var(--muted-foreground, GrayText); }
  .kv dd { margin: 0; overflow-wrap: anywhere; font-family: var(--font-mono, ui-monospace, monospace); font-size: 11.5px; }
  .tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border, #8884); }
  .tab { border: 0; background: none; padding: 8px 10px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted-foreground, GrayText); min-height: 36px; }
  .tab[aria-selected=true] { color: var(--foreground, CanvasText); border-bottom-color: var(--primary, LinkText); font-weight: 600; }
  .msg { padding: 9px 12px; border-bottom: 1px solid var(--border, #8882); }
  .msg .who { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground, GrayText); }
  .msg.assistant .who { color: var(--primary, var(--link, LinkText)); }
  .msg.error .who { color: var(--destructive, red); }
  .msg.fresh { animation: fresh 2s ease-out; }
  @keyframes fresh { from { background: var(--accent, #8883); } }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
  .msg .body.clip { max-height: 14em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .more { margin-top: 4px; border: 0; background: none; color: var(--link, LinkText); cursor: pointer; padding: 4px 0; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .primary { border: 0; border-radius: var(--radius, 8px); padding: 7px 12px; min-height: 32px; cursor: pointer; font-weight: 600; background: var(--primary, LinkText); color: var(--primary-foreground, Canvas); }
  .primary:disabled, .ghost:disabled { opacity: .55; cursor: default; }
  .ghost { border: 1px solid var(--border, #8886); background: var(--card, transparent); border-radius: var(--radius, 8px); padding: 6px 10px; cursor: pointer; min-height: 32px; }
  .notice { font-size: 12px; overflow-wrap: anywhere; color: var(--muted-foreground, GrayText); }
  .notice.ok { color: var(--success-fg, var(--success, green)); }
  .notice.warn { color: var(--warning-fg, var(--warning, darkorange)); }
  .error-box { margin: 12px; padding: 10px; border-radius: var(--radius, 8px); background: var(--destructive-bg, #d001); color: var(--destructive, red); overflow-wrap: anywhere; }
  .composer { border-top: 1px solid var(--border, #8884); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--background, Canvas); }
  .composer textarea { width: 100%; min-height: 54px; max-height: 160px; resize: vertical; padding: 7px 10px; border-radius: var(--radius, 8px); border: 1px solid var(--input, var(--border, #8886)); background: var(--card, transparent); }
  .composer .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 10px 12px; }
  .stat { border: 1px solid var(--border, #8884); border-radius: var(--radius, 8px); padding: 8px 10px; background: var(--card, transparent); }
  .stat .label { font-size: 11px; color: var(--muted-foreground, GrayText); text-transform: uppercase; letter-spacing: .03em; }
  .stat .value { font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 11px; color: var(--muted-foreground, GrayText); }
  .section { padding: 4px 12px 10px; }
  .section h3 { font-size: 12px; margin: 8px 0 6px; }
  .bar { display: grid; grid-template-columns: minmax(80px, 30%) 1fr max-content; gap: 8px; align-items: center; font-size: 12px; margin: 3px 0; }
  .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono, ui-monospace, monospace); font-size: 11.5px; }
  .bar .track { height: 8px; border-radius: 4px; background: var(--muted, #8882); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--chart-1, var(--primary, LinkText)); }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 48px; }
  .spark span { flex: 1; min-width: 3px; background: var(--chart-2, var(--primary, LinkText)); border-radius: 2px 2px 0 0; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border, #8882); font-size: 12px; }
  .crumbs button { border: 0; background: none; color: var(--link, LinkText); cursor: pointer; padding: 2px 0; }
  .file-row { display: grid; grid-template-columns: 1fr max-content; gap: 8px; }
  .page-card { padding: 10px 12px; border-bottom: 1px solid var(--border, #8882); }
  .page-card .title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item.pages-row .title { color: var(--primary, var(--link, LinkText)); }
  .item.questions-row .title { color: var(--warning-fg, var(--warning, darkorange)); }
  .q-card { padding: 10px 12px; border-bottom: 1px solid var(--border, #8882); }
  .q-card .title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .q-card .options { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .q-card .options .ghost { text-align: start; display: flex; flex-direction: column; gap: 2px; }
  .q-card .options .ghost .sub { font-size: 12px; color: var(--muted-foreground, GrayText); }
  .q-card input { flex: 1 1 180px; min-height: 32px; padding: 6px 10px; border-radius: var(--radius, 8px); border: 1px solid var(--input, var(--border, #8886)); background: var(--card, transparent); color: inherit; }
  .q-card.recorded .title { font-weight: 500; font-size: 13px; }
  .q-card .options .chip { margin-inline-start: 6px; }
  .chip.source { border-style: dashed; }
  pre.preview { margin: 0; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono, ui-monospace, monospace); font-size: 11.5px; }

  /* Phone: one pane at a time, drill in and back. */
  .mobile .panes { display: block; }
  .mobile .pane { display: none; height: 100%; border-right: 0; }
  .mobile[data-view=runs] .pane.runs, .mobile[data-view=sessions] .pane.sessions, .mobile[data-view=detail] .pane.detail-pane { display: flex; }
  .mobile[data-view=sessions] header .back, .mobile[data-view=detail] header .back { display: inline-block; }
  .mobile header h1 { max-width: 55%; }
  .mobile[data-view=sessions] input[type=search], .mobile[data-view=detail] input[type=search] { display: none; }
  .mobile .item { padding: 11px 14px; min-height: 48px; }
  .mobile input[type=search] { min-height: 40px; font-size: 16px; }
  .mobile .ghost, .mobile .primary, .mobile .tab { min-height: 44px; }
  .mobile .composer textarea { font-size: 16px; }
</style>
</head>
<body>
<div class="app" id="app" data-view="runs">
  <header>
    <button class="ghost back" id="back" type="button" aria-label="Back">‹ Back</button>
    <h1 id="heading">SDK sessions</h1>
    <input type="search" id="search" placeholder="Search sessions on every host" aria-label="Search sessions" />
  </header>
  <div class="panes">
    <section class="pane runs" aria-label="Hosts and runs">
      <div class="scroll">
        <h2>Hosts</h2><div id="hosts"><div class="empty">Loading…</div></div>
        <h2 id="runs-heading">Runs</h2><div id="runs"></div>
      </div>
    </section>
    <section class="pane sessions" aria-label="Sessions"><div class="scroll"><h2 id="sessions-heading">Sessions</h2><div id="sessions"><div class="empty">Pick a run.</div></div></div></section>
    <section class="pane detail-pane" aria-label="Session">
      <div id="detail-head"></div>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" type="button" data-tab="transcript" aria-selected="true">Transcript</button>
        <button class="tab" role="tab" type="button" data-tab="telemetry" aria-selected="false">Telemetry</button>
        <button class="tab" role="tab" type="button" data-tab="files" aria-selected="false">Files</button>
      </div>
      <div class="scroll" id="detail-body"><div class="empty">Pick a session.</div></div>
      <div id="composer"></div>
    </section>
  </div>
</div>
<script>
(() => {
  const embedded = window.parent !== window;
  const pending = new Map();
  let hostContext = {};
  const newKey = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random());
  const app = document.getElementById("app");
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const state = {
    hosts: [], hostId: "local", runs: [], runId: null, sessions: [], sessionId: null,
    query: "", hits: null, tab: "transcript",
    detail: null, // { session, messages: [], cursor, eventCursor, activity }
    files: { root: null, path: "", preview: null },
    pages: { runId: null, list: [], pageStudio: false },
    showPages: false,
    questions: { runId: null, list: [], answers: false },
    showQuestions: false,
  };
  let watchGeneration = 0;

  function applyContext(next) {
    hostContext = { ...hostContext, ...(next || {}) };
    const vars = hostContext.styles && hostContext.styles.variables;
    if (vars) for (const [key, value] of Object.entries(vars)) document.documentElement.style.setProperty(key, value);
    if (hostContext.theme) document.documentElement.dataset.theme = hostContext.theme;
    app.classList.toggle("mobile", hostContext.formFactor === "mobile");
  }

  if (embedded) {
    addEventListener("message", (event) => {
      if (event.source !== parent || !event.data || event.data.jsonrpc !== "2.0") return;
      const message = event.data;
      const pendingCall = message.id !== undefined ? pending.get(message.id) : undefined;
      if (pendingCall) {
        pending.delete(message.id);
        if (message.error) pendingCall.reject(new Error(message.error.message || "Request failed."));
        else pendingCall.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
    });
  }

  function request(method, params) {
    if (!embedded) return Promise.reject(new Error("Not inside Marshal."));
    const id = newKey();
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    });
  }

  const ready = request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "SDK sessions", version: "0.2.0" },
    hostChrome: "compact",
  }).then((result) => {
    applyContext(result && result.hostContext);
    parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
  });

  async function call(name, args) {
    await ready;
    const result = await request("tools/call", { name, arguments: args || {}, _meta: { idempotencyKey: newKey() } });
    if (result && result.isError) {
      const text = (result.structuredContent && result.structuredContent.error && result.structuredContent.error.message)
        || ((result.content || []).find((part) => part.type === "text") || {}).text || "Request failed.";
      throw new Error(text);
    }
    let out = result && result.structuredContent;
    if (out && "output" in out) out = out.output;
    if (out && typeof out === "object" && "result" in out) out = out.result;
    if (out && out.ok === false && out.error) throw new Error(out.message || out.error);
    return out;
  }

  const el = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (key === "class") node.className = value;
      else if (key === "style") node.setAttribute("style", value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child.nodeType ? child : String(child));
    return node;
  };
  const money = (value) => "$" + (value || 0).toFixed((value || 0) < 1 ? 3 : 2);
  const count = (value) => (value >= 1e6 ? (value / 1e6).toFixed(1) + "M" : value >= 1000 ? (value / 1000).toFixed(1) + "k" : String(value || 0));
  const ms = (value) => (value >= 60000 ? (value / 60000).toFixed(1) + " min" : value >= 1000 ? (value / 1000).toFixed(1) + " s" : Math.round(value || 0) + " ms");
  const when = (iso) => {
    const date = new Date(iso);
    return isNaN(date) ? "" : date.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  };
  const clock = (iso) => {
    const date = new Date(iso);
    return isNaN(date) ? "" : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  };
  const seconds = (from, to) => Math.max(0, Math.round((new Date(to) - new Date(from)) / 1000));
  const shortId = (id) => String(id || "").slice(0, 8);
  const badge = (value, text) => el("span", { class: "state " + value }, text || value);
  const showError = (target, error) => target.replaceChildren(el("div", { class: "error-box" }, error.message || String(error)));
  const host = () => state.hosts.find((entry) => entry.id === state.hostId) || { id: state.hostId, kind: "folder", mode: "folder" };
  const isLive = () => host().mode === "live" && host().status === "online";
  const currentSession = () => (state.detail && state.detail.session) || state.sessions.find((session) => session.id === state.sessionId);

  function setView(view) {
    app.dataset.view = view;
    const session = currentSession();
    $("heading").textContent = view === "runs" ? "SDK sessions"
      : view === "sessions" ? (host().name || state.hostId) + " · run " + shortId(state.runId)
      : state.showPages ? "Pages · run " + shortId(state.runId)
      : state.showQuestions ? "Questions · run " + shortId(state.runId)
      : (session && session.title) || "Session";
  }

  // ---------- hosts and runs ----------
  function renderHosts() {
    const box = $("hosts");
    if (!state.hosts.length) return box.replaceChildren(el("div", { class: "empty" }, "No hosts."));
    box.replaceChildren(...state.hosts.map((entry) => {
      const cloud = entry.mode === "cloud";
      const status = cloud ? "online" : entry.kind === "folder" ? "local" : entry.status;
      const mode = cloud ? "cloud" : entry.kind === "folder" ? "folder" : entry.status === "online" ? entry.mode : "offline";
      const runs = Array.isArray(entry.runs) ? entry.runs.length : entry.runs;
      return el("button", { class: "item", type: "button", "aria-current": entry.id === state.hostId, onclick: () => openHost(entry.id) },
        el("div", { class: "title" }, el("span", { class: "dot " + (status === "online" ? "online" : status === "offline" ? "offline" : "") }), entry.name || entry.id, badge(mode, mode === "store" ? "store-only" : mode)),
        el("div", { class: "meta" }, cloud
          ? (runs || 0) + " runs (" + (entry.marshalRuns || 0) + " with sessions) · " + String(entry.uri || "").replace(/^gs:\/\//, "")
          : entry.kind === "folder"
          ? (entry.stores ? entry.stores.length : 0) + " stores · " + (runs || 0) + " runs"
          : entry.status === "online"
            ? (entry.remote ? entry.remote.id + " (" + entry.remote.kind + ")" : "") + " · sdk " + entry.sdkVersion + " · " + (runs || 0) + " runs · " + (entry.capabilities || []).length + " capabilities"
            : (entry.message || "unreachable")),
        entry.kind === "link" ? el("div", { class: "meta" }, entry.url + " · token " + entry.token) : null,
        entry.kind === "link" && entry.extensions && entry.extensions.length
          ? el("div", { class: "chips" }, ...entry.extensions.map((extension) => el("span", { class: "chip" }, extension.identity + "@" + extension.version)))
          : null);
    }));
  }

  function renderRuns() {
    const box = $("runs");
    $("runs-heading").textContent = "Runs · " + (host().name || state.hostId);
    if (host().kind === "link" && host().status !== "online") return box.replaceChildren(el("div", { class: "empty" }, "This host is offline: " + (host().message || "unreachable") + "."));
    if (host().mode === "cloud") return renderCloudRuns(box);
    if (!state.runs.length) return box.replaceChildren(el("div", { class: "empty" }, "No runs on this host."));
    box.replaceChildren(...state.runs.map((run) =>
      el("button", { class: "item", type: "button", "aria-current": run.runId === state.runId, onclick: () => openRun(run.runId) },
        el("div", { class: "title" }, String(run.firstTitle || "").replace(/ · .*$/, "") + " · " + shortId(run.runId), run.running ? el("span", { class: "dot pulse", title: "running" }) : null),
        el("div", { class: "meta" }, when(run.startedAt) + " · " + seconds(run.startedAt, run.updatedAt) + "s · " + run.sessions + " sessions · " + money(run.costUsd)),
        el("div", { class: "chips" },
          el("span", { class: "chip" }, run.host.id + " (" + run.host.kind + ")"),
          ...(run.sources || []).map((source) => el("span", { class: "chip source", title: source.folder }, source.pulledFrom ? "pulled from " + source.pulledFrom + " · " + source.label : "📁 " + source.label)),
          ...(run.models || []).map((model) => el("span", { class: "chip" }, model)),
          run.running ? badge("running", run.running + " running") : null,
          run.failed ? badge("failed", run.failed + " failed") : null))));
  }

  function openLink(url) {
    request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));
  }

  // A cloud host lists every run under its bucket prefix: runs with Marshal state (sessions, pages) open like any run;
  // runs from their older pipeline have only a preview, which can be brought into Page Studio to compare.
  function renderCloudRuns(box) {
    const list = state.cloudRuns || [];
    if (!list.length) return box.replaceChildren(el("div", { class: "empty" }, "No runs under " + (host().uri || "this prefix") + "."));
    box.replaceChildren(...list.map((run) => {
      const notice = el("div", { class: "notice", role: "status", "aria-live": "polite" });
      const preview = el("button", { class: "ghost", type: "button", onclick: (event) => { event.stopPropagation(); openLink(run.previewUrl); } }, "Preview");
      const bring = el("button", { class: run.marshal ? "ghost" : "primary", type: "button", onclick: async (event) => {
        event.stopPropagation();
        bring.disabled = true;
        notice.className = "notice";
        notice.textContent = "Bringing the page and its pictures into Page Studio…";
        try {
          const out = await call("sdksessions.importCloudPage", { outputRoot: run.outputRoot, open: true });
          notice.className = "notice " + (out && out.ok ? "ok" : "warn");
          notice.textContent = out && out.ok ? out.message + " " + (out.pictures || 0) + " pictures." : (out && out.message) || "Couldn't bring it in.";
        } catch (error) {
          notice.className = "notice warn";
          notice.textContent = error.message || String(error);
        } finally {
          bring.disabled = false;
        }
      } }, "Bring into Page Studio");

    const cloudRun = host().mode === "cloud" ? (state.cloudRuns || []).find((run) => run.runId === state.runId) : null;
    const push = cloudRun ? el("button", { class: "ghost", type: "button", onclick: async () => {
      push.disabled = true;
      notice.className = "notice";
      notice.textContent = "Pushing your Page Studio version back to the cloud run…";
      try {
        const out = await call("sdksessions.pushToCloud", { pageId: page.id, outputRoot: cloudRun.outputRoot, cloudPageId: page.id });
        notice.className = "notice " + (out && out.ok ? "ok" : "warn");
        notice.textContent = out && out.ok ? "Pushed v" + out.version + ": their page generator now shows it (" + out.sections.length + " sections, " + out.pictures + " pictures). The old preview is kept in agent/edits." : (out && out.message) || "Couldn't push.";
        if (out && out.ok) setTimeout(() => loadSessions().catch(() => {}), 300);
      } catch (error) {
        notice.className = "notice warn";
        notice.textContent = error.message || String(error);
      } finally {
        push.disabled = false;
      }
    } }, "Push my edits to the cloud run") : null;
    return el("div", { class: "page-card" },
      el("div", { class: "title" }, page.title, page.brand && page.brand.name ? el("span", { class: "chip" }, page.brand.name) : null),
      el("div", { class: "meta" }, page.sections + " sections · " + pictures.library + " library pictures" + (pictures.missing ? " (" + pictures.missing + " not on the host)" : "") + " · v" + page.version + " · " + when(page.updatedAt) + (page.notesOpen ? " · " + page.notesOpen + " open notes" : "")),
      page.labels && page.labels.length ? el("div", { class: "chips" }, ...page.labels.map((label) => el("span", { class: "chip" }, label))) : null,
      el("div", { class: "meta" }, page.id + (page.from ? " · " + page.from : "")),
      el("div", { class: "actions" }, button, push, cloudRun ? el("button", { class: "ghost", type: "button", onclick: () => openLink(cloudRun.previewUrl) }, "Cloud preview") : null, notice));
  }

  function renderPages() {
    $("tabs").style.display = "none";
    $("composer").replaceChildren();
    const h = host();
    $("detail-head").replaceChildren(el("div", { class: "detail" },
      el("div", { class: "title" }, "Pages from run " + shortId(state.runId)),
      el("div", { class: "live" }, h.mode === "cloud"
        ? "In the cloud run's state (" + String(h.uri || "").replace(/^gs:\/\//, "") + "). Open it in Page Studio, edit and comment there, then push your version back: the run's preview and page record are replaced, the previous preview is kept."
        : h.kind === "link" ? "On " + (h.name || h.id) + "; Open in Page Studio pulls the page and its pictures over the link first." : "In this run's Page Studio folder on this Mac."),
      el("div", { class: "notice" }, "Each opens in your Page Studio as an ordinary page (sections, pictures, notes) that people keep editing; the run's copy stays as it is.")));
    const pages = state.pages.runId === state.runId ? state.pages.list : [];
    $("detail-body").replaceChildren(...(pages.length ? pages.map(pageCard) : [el("div", { class: "empty" }, "This run made no pages.")]));
  }

  function openQuestions() {
    stopWatch();
    state.showQuestions = true;
    state.showPages = false;
    state.sessionId = null;
    state.detail = null;
    renderSessions();
    setView("detail");
    renderQuestions();
  }

  function questionCard(entry) {
    const notice = el("div", { class: "notice", role: "status", "aria-live": "polite" });
    const asking = el("div", { class: "meta" }, "Asked by " + (entry.sessionTitle || shortId(entry.sessionId) || "the host") + " · " + when(entry.createdAt));
    if (entry.status === "answered" && entry.answer) {
      const by = (entry.answer.by && (entry.answer.by.name || entry.answer.by.personId)) || "someone";
      return el("div", { class: "q-card" },
        el("div", { class: "title" }, entry.text), asking,
        el("div", { class: "notice ok" }, "Answered by " + by + (entry.answer.route ? " (" + entry.answer.route + ")" : "") + ": " + entry.answer.text));
    }
    const answers = state.questions.answers;
    const controls = [];
    const send = async (payload, button) => {
      for (const control of controls) control.disabled = true;
      notice.className = "notice";
      notice.textContent = "Sending your answer…";
      try {
        const out = await call("sdksessions.answer", { hostId: state.hostId, questionId: entry.id, ...payload });
        notice.className = "notice " + (out && out.ok ? "ok" : "warn");
        notice.textContent = out && out.ok ? "Answered. The session has it as a message from you." : (out && out.message) || "The answer was not taken.";
        if (out && out.ok) setTimeout(() => loadSessions().catch(() => {}), 300);
        else for (const control of controls) control.disabled = false;
      } catch (error) {
        notice.className = "notice warn";
        notice.textContent = error.message || String(error);
        for (const control of controls) control.disabled = false;
      }
    };
    const options = (entry.options || []).map((option, index) => {
      const button = el("button", { class: "ghost", type: "button", disabled: !answers, onclick: () => send({ choice: index }, button) },
        el("span", {}, (index + 1) + ". " + option.title, index === entry.recommendedIndex ? el("span", { class: "chip" }, "recommended") : null),
        option.description ? el("span", { class: "sub" }, option.description) : null);
      controls.push(button);
      return button;
    });
    const input = el("input", { type: "text", placeholder: options.length ? "Or write your own answer" : "Your answer", "aria-label": "Your answer to: " + entry.text, disabled: !answers });
    const submit = el("button", { class: "primary", type: "button", disabled: !answers, onclick: () => input.value.trim() && send({ text: input.value.trim() }, submit) }, "Answer");
    input.addEventListener("keydown", (event) => { if (event.key === "Enter" && input.value.trim()) send({ text: input.value.trim() }, submit); });
    controls.push(input, submit);
    if (!answers) {
      notice.className = "notice warn";
      notice.textContent = host().kind === "link" ? "This host serves a finished run; nobody is there to take the answer." : "A run in a folder on this Mac has no host running it; answer it where it runs.";
    }
    return el("div", { class: "q-card" },
      el("div", { class: "title" }, entry.text), asking,
      entry.defaultTaken ? el("div", { class: "meta" }, "Meanwhile it went with: " + entry.defaultTaken) : null,
      options.length ? el("div", { class: "options" }, ...options) : null,
      el("div", { class: "actions" }, input, submit),
      notice);
  }

  function renderQuestions() {
    $("tabs").style.display = "none";
    $("composer").replaceChildren();
    const h = host();
    const list = state.questions.runId === state.runId ? state.questions.list : [];
    const asked = list.filter((entry) => entry.kind === "question");
    const open = asked.filter((entry) => entry.status === "open");
    const answered = asked.filter((entry) => entry.status !== "open");
    const recorded = list.filter((entry) => entry.kind !== "question");
    $("detail-head").replaceChildren(el("div", { class: "detail" },
      el("div", { class: "title" }, "Questions from run " + shortId(state.runId)),
      el("div", { class: "live" }, h.kind === "link" ? "On " + (h.name || h.id) + "; your answer goes back over the link." : "In this run's folder on this Mac (read only)."),
      el("div", { class: "notice" }, "The first answer wins; it reaches the asking session as a message from you.")));
    const nodes = [
      ...open.map(questionCard),
      ...answered.map(questionCard),
      recorded.length ? el("div", { class: "section" }, el("h3", {}, "Recorded by the sessions")) : null,
      ...recorded.map((entry) => el("div", { class: "q-card recorded" },
        el("div", { class: "title" }, el("span", { class: "chip" }, entry.kind), " ", entry.text),
        el("div", { class: "meta" }, (entry.sessionTitle || shortId(entry.sessionId) || "the host") + " · " + when(entry.createdAt) + (entry.defaultTaken ? " · went with: " + entry.defaultTaken : "")))),
    ].filter(Boolean);
    $("detail-body").replaceChildren(...(nodes.length ? nodes : [el("div", { class: "empty" }, "This run asked nothing.")]));
  }

  function renderDetail() {
    if (state.showQuestions) return renderQuestions();
    if (state.showPages) return renderPages();
    $("tabs").style.display = "";
    for (const tab of document.querySelectorAll(".tab")) tab.setAttribute("aria-selected", String(tab.dataset.tab === state.tab));
    if (!state.sessionId || !state.detail) {
      $("detail-head").replaceChildren();
      $("composer").replaceChildren();
      if (!state.sessionId) $("detail-body").replaceChildren(el("div", { class: "empty" }, "Pick a session."));
      return;
    }
    renderHead();
    renderComposer();
    if (state.tab === "transcript") renderTranscript();
    else if (state.tab === "telemetry") renderTelemetry();
    else renderFiles();
  }

  async function watch(generation, sessionId) {
    let first = true;
    while (generation === watchGeneration && state.sessionId === sessionId) {
      const detail = state.detail;
      if (!detail) return;
      try {
        const out = await call("sdksessions.watch", {
          hostId: state.hostId, sessionId, since: detail.cursor, eventCursor: detail.eventCursor,
          state: detail.session.state, updatedAt: detail.session.updatedAt, waitMs: first ? 0 : 12000,
        });
        first = false;
        if (generation !== watchGeneration || !out || !out.found) return;
        const stateChanged = out.session.state !== detail.session.state || out.session.updatedAt !== detail.session.updatedAt;
        detail.session = out.session;
        detail.eventCursor = out.eventCursor;
        const latest = (out.activity || []).filter((activity) => activity.kind === "tool" || activity.kind === "text").at(-1);
        if (latest) detail.activity = latest.kind === "tool" ? "calling " + latest.name : "writing";
        if (out.session.state !== "running") detail.activity = null;
        const fresh = (out.messages || []).filter((message) => message.index >= detail.cursor);
        detail.cursor = Math.max(detail.cursor, out.cursor);
        if (fresh.length) {
          detail.messages.push(...fresh);
          if (state.tab === "transcript") {
            const box = $("detail-body");
            if (detail.messages.length === fresh.length) box.replaceChildren();
            const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
            for (const message of fresh) box.append(messageNode(message, true));
            if (nearBottom) box.scrollTop = box.scrollHeight;
          }
        }
        if (stateChanged || fresh.length || latest) {
          renderHead();
          if (stateChanged) {
            renderComposer();
            const index = state.sessions.findIndex((session) => session.id === sessionId);
            if (index >= 0) { state.sessions[index] = out.session; renderSessions(); }
            if (state.tab === "telemetry") renderTelemetry();
          }
        }
      } catch (error) {
        await sleep(3000);
      }
    }
  }

  for (const tab of document.querySelectorAll(".tab")) {
    tab.addEventListener("click", () => {
      state.tab = tab.dataset.tab;
      renderDetail();
    });
  }
  $("back").addEventListener("click", () => setView(app.dataset.view === "detail" ? "sessions" : "runs"));
  let searchTimer = 0;
  $("search").addEventListener("input", (event) => {
    clearTimeout(searchTimer);
    const query = event.target.value.trim();
    searchTimer = setTimeout(() => runSearch(query), 250);
  });

  async function runSearch(query) {
    state.query = query;
    if (!query) { state.hits = null; renderSessions(); return; }
    try {
      state.hits = (await call("sdksessions.search", { query, limit: 30 })).hits || [];
      renderSessions();
      setView("sessions");
    } catch (error) {
      showError($("sessions"), error);
    }
  }

  // Refresh hosts and the open run's sessions while the tab is open, so new runs and state changes show up.
  setInterval(async () => {
    if (document.hidden) return;
    try {
      await loadHosts();
      const out = await call("sdksessions.runs", { hostId: state.hostId });
      state.runs = out.runs || [];
      renderRuns();
      if (state.runId && !state.hits) await loadSessions();
    } catch {}
  }, 10000);

  (async () => {
    try {
      await ready;
      const out = await loadHosts();
      const opened = hostContext.toolInput || {};
      const wanted = opened.hostId || opened.runId || opened.sessionId || opened.query ? opened : out.focus || {};
      const hostId = wanted.hostId && state.hosts.some((entry) => entry.id === wanted.hostId) ? wanted.hostId : "local";
      if (["transcript", "telemetry", "files"].includes(wanted.tab)) state.tab = wanted.tab;
      const wantsPages = wanted.tab === "pages";
      const wantsQuestions = wanted.tab === "questions";
      await openHost(hostId);
      const runId = wanted.runId || (state.runs[0] && state.runs[0].runId);
      if (runId) {
        await openRun(runId, !!wanted.sessionId);
        if (wantsPages) openPages();
        else if (wantsQuestions) openQuestions();
        else if (wanted.sessionId) {
          await openSession(wanted.sessionId);
          if (wanted.filesRoot) {
            state.files = { root: wanted.filesRoot, path: wanted.filesPath || "", preview: null };
            if (state.tab === "files") renderFiles();
          }
        }
        else if (!wanted.runId) setView("runs");
      } else {
        setView("runs");
      }
      if (typeof wanted.query === "string" && wanted.query.trim()) {
        $("search").value = wanted.query.trim();
        await runSearch(wanted.query.trim());
      }
    } catch (error) {
      showError($("hosts"), error);
    }
  })();
})();
</script>
</body>
</html>
